<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 底：站上的深色面板色，不用漸層 -->
  <rect width="512" height="512" fill="#11141a"/>

  <!-- 經緯格線，跟站上的地圖紙底紋同一個語彙，淡淡鋪滿一層 -->
  <g stroke="#2b3340" stroke-width="2">
    <path d="M64 0v512M128 0v512M192 0v512M256 0v512M320 0v512M384 0v512M448 0v512"/>
    <path d="M0 64h512M0 128h512M0 192h512M0 256h512M0 320h512M0 384h512M0 448h512"/>
  </g>

  <!-- 地球。緯線畫成完整的扁橢圓，寬度取該緯度在球面上的實際弦長
       （半弦長 = sqrt(150² - 75²) = 129.9），左右兩端剛好落在外圈上。
       這跟 scripts/make_icons.py 產 PNG 時是同一套幾何，兩邊要一致 -->
  <g fill="none" stroke="#c9a227" stroke-width="16">
    <circle cx="256" cy="256" r="150"/>
    <path d="M106 256h300"/>
    <ellipse cx="256" cy="256" rx="63" ry="150"/>
    <ellipse cx="256" cy="181" rx="129.9" ry="39"/>
    <ellipse cx="256" cy="331" rx="129.9" ry="39"/>
  </g>

  <!-- 定位標記：這站是拿來認地點的，圓心插一根釘。
       先用底色挖掉交會處的線，再點上金色圓點 -->
  <circle cx="256" cy="256" r="30" fill="#11141a"/>
  <circle cx="256" cy="256" r="17" fill="#c9a227"/>
</svg>
